# This workflow is used to build releases
# It can also be called by other workflows to reuse the release flow.
name: Release

on:
  # If you push to main this will trigger a stable release
  push:
    branches:
      - master
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
        description: "Is this a snapshot build?"
        required: false
        default: false
        type: boolean
      skipEvergreen:
        description: "Skip the evergreen 'latest snapshot' S3 upload (used for ad-hoc snapshot builds, e.g. from a hotfix branch, that must not clobber development's evergreen alias)"
        required: false
        default: false
        type: boolean

  # Manual Trigger for LTS Releases
  workflow_dispatch:
    inputs:
      lts:
        description: 'The LTS marker'
        required: false
        default: true
        type: boolean

env:
  MODULE_ID: ${{ github.event.repository.name }}
  SNAPSHOT: ${{ inputs.snapshot || false }}
  SKIP_EVERGREEN: ${{ inputs.skipEvergreen || false }}
  JDK: 21
  BUILD_ID: ${{ github.run_number }}
  LTS: ${{ inputs.lts || false }}

jobs:
  #############################################
  # Build Snapshot or Final Release
  #############################################
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK }}

      - name: Setup Environment Variables For Build Process
        id: current_version
        run: |
          TMPVERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          # Strip any existing prerelease identifier to get the base version
          BASEVERSION=$(echo $TMPVERSION | sed 's/-.*$//')

          # Whether this is a snapshot build is decided by the `snapshot` input (via $SNAPSHOT),
          # not by which branch we happen to be on - that let a hotfix/* snapshot silently build
          # unversioned, since it isn't the `development` branch.
          if [ "$SNAPSHOT" == "true" ]; then
            if [ "$GITHUB_REF" == "refs/heads/development" ]; then
              TMPVERSION="${BASEVERSION}-snapshot"
            else
              # Branch-scope the suffix so a non-development snapshot (e.g. a hotfix branch)
              # can never collide with development's snapshot version/S3 path
              SAFE_BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr -c 'a-zA-Z0-9' '-')
              TMPVERSION="${BASEVERSION}-${SAFE_BRANCH}-snapshot"
            fi
          fi
          echo "VERSION=$TMPVERSION" >> $GITHUB_ENV

          # Branch
          echo "Github Ref is $GITHUB_REF"
          # build.gradle's `branch == 'development'` check drives its own -snapshot suffix on
          # build artifact filenames and its evergreen alias naming, so keep BRANCH=development
          # for ANY snapshot build (not just literal development) to keep gradle-level and
          # workflow-level version logic in sync.
          if [ "$SNAPSHOT" == "true" ]; then
            echo "BRANCH=development" >> $GITHUB_ENV
          else
            echo "BRANCH=main" >> $GITHUB_ENV
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.VERSION }}

      - name: Build v${{ env.VERSION }}
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          ./gradlew downloadBoxLang
          ./gradlew build -x test --stacktrace --console=plain

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v10.0.0
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Finalized changelog for v${{ env.VERSION }}"
          add: changelog.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ env.VERSION }}"
          force_push_tag: true
          message: "Latest Release v${{ env.VERSION }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: boxlang-build
          path: |
            build/reports/tests/**
            changelog.md

      - name: Upload Distributions to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/distributions"
          DEST_DIR: "ortussolutions/boxlang-runtimes/${{ env.MODULE_ID }}/${{ env.VERSION }}"

      - name: Upload Evergreen Distributions to S3
        if: env.SKIP_EVERGREEN == 'false'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/evergreen"
          DEST_DIR: "ortussolutions/boxlang-runtimes/${{ env.MODULE_ID }}/"

      - name: Upload API Docs to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "apidocs.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/docs/javadoc"
          DEST_DIR: "boxlang-runtimes/${{ env.MODULE_ID }}/${{ env.VERSION }}"

      # Publish to Maven Central + Github ONLY on Beta/Final Releases
      - name: Publish to GitHub
        if: env.SNAPSHOT == 'false'
        run: |
          ./gradlew publish --no-daemon --no-parallel --info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

      # Publish to Maven Central
      - name: Publish to Maven
        if: env.SNAPSHOT == 'false'
        run: |
          ./gradlew publishAggregationToCentralPortal --stacktrace --info
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        continue-on-error: true
        if: env.SNAPSHOT == 'false'
        id: create_release
        with:
          title: ${{ env.VERSION }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}

      - name: Inform Slack
        if: ${{ always() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "Module ${{ env.MODULE_ID }} v${{ env.VERSION }} Built with ${{ job.status }}!"
          SLACK_TITLE: "BoxLang Module ${{ env.MODULE_ID }}"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: ${{ inputs.snapshot != true }}
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      checks: write
      contents: write
    steps:
      - name: Checkout Development Repository
        uses: actions/checkout@v7
        if: env.LTS == 'false'
        with:
          ref: development

      - name: Checkout LTS Repository
        uses: actions/checkout@v7
        if: env.LTS == 'true'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: boxlang-build
          path: .tmp

      - name: Copy Changelog
        run: |
          cp .tmp/changelog.md changelog.md

      - name: Bump Version
        run: |
          if [ $LTS == 'true' ]
          then
            ./gradlew bumpPatchVersion --stacktrace --console=plain
          else
            ./gradlew bumpMinorVersion --stacktrace --console=plain
          fi
          git pull

      - name: Commit Version Bump
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Version bump"
          add: |
            gradle.properties
            changelog.md
