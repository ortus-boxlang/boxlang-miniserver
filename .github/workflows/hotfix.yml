name: Hotfix Branch CI

# Gives hotfix/* branches the same push-triggered feedback (tests + formatting)
# that other feature branches get via pr.yml, so a hotfix can be validated
# before it's merged or published via hotfix-snapshot.yml.
on:
  push:
    branches:
      - "hotfix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - uses: Ortus-Solutions/commandbox-action@v1.0.3
        with:
          cmd: run-script format:check

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck
